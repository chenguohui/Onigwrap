name: Publish from build artifacts

# Temporary workflow: publishes a package using the runtimes artifact from a
# successful "Build Onigwrap native assets" run, avoiding the flaky macOS
# arm64 hosted-runner queue. Triggered by pushing to this dedicated branch.

on:
  push:
    branches:
      - ci/publish-1.0.9

env:
  VERSION: "1.0.9"
  BUILD_RUN_ID: "44272393507"

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Download runtimes from build run
        uses: actions/download-artifact@v4
        with:
          name: runtimes
          path: runtimes
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore project
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release -p:Version="$VERSION" --no-restore
      - name: Pack
        run: dotnet pack -c Release -p:Version="$VERSION" -o . --no-restore --no-build
      - name: Publish
        run: dotnet nuget push "Onigwrap.$VERSION.nupkg" -k "${{ secrets.NUGET_API_KEY }}" -s loongnix --configfile ci/nuget.loongnix.config
      - name: Verify package on feed
        run: |
          VER="${VERSION,,}"
          for attempt in $(seq 1 10); do
            if curl -fsI "https://nuget.loongnix.cn/v3/package/onigwrap/${VER}/onigwrap.${VER}.nupkg" > /dev/null; then
              echo "Package ${VER} is available on the feed."
              exit 0
            fi
            echo "Package ${VER} not visible yet (attempt ${attempt}/10), retrying..."
            sleep 3
          done
          echo "Package ${VER} was not found on the feed." >&2
          exit 1
